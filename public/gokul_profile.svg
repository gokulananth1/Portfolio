<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f24" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />

  <!-- Geometric Grid & Circuit Lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="600" x2="800" y2="600" />
    <line x1="0" y1="800" x2="800" y2="800" />
    <line x1="200" y1="0" x2="200" y2="1000" />
    <line x1="400" y1="0" x2="400" y2="1000" />
    <line x1="600" y1="0" x2="600" y2="1000" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="400" cy="450" r="240" fill="#8b5cf6" opacity="0.15" filter="url(#glow)" />
  <circle cx="450" cy="500" r="180" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />

  <!-- Outer Tech Rings -->
  <circle cx="400" cy="460" r="220" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-dasharray="12 10" />
  <circle cx="400" cy="460" r="260" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5" />
  <circle cx="400" cy="460" r="180" fill="rgba(255,255,255,0.02)" stroke="rgba(139, 92, 246, 0.3)" stroke-width="2" />

  <!-- Core Avatar Shield -->
  <circle cx="400" cy="460" r="150" fill="url(#bgGrad)" stroke="url(#orbGrad)" stroke-width="4" filter="url(#glow)" />

  <!-- Monogram Logo -->
  <text x="400" y="495" font-family="'Syne', 'Inter', sans-serif" font-size="96" font-weight="900" fill="white" text-anchor="middle" letter-spacing="4">GA</text>
  <text x="400" y="540" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="8">GOKUL A</text>

  <!-- Title Badges -->
  <g transform="translate(400, 750)">
    <rect x="-180" y="-20" width="360" height="40" rx="20" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="0" y="5" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle" letter-spacing="2">COMPUTER SCIENCE ENGINEER</text>
  </g>

  <g transform="translate(400, 810)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle">JAVA STACK • AI/ML • NETWORKING</text>
  </g>

  <g transform="translate(400, 870)">
    <circle cx="-90" cy="0" r="5" fill="#10b981" />
    <text x="-75" y="4" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="start" letter-spacing="1">AVAILABLE FOR OPPORTUNITIES</text>
  </g>
</svg>
