    <meta property="og:title" content="Gokul A - Portfolio" />

    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-color: #020617;
        --accent-purple: #8b5cf6;
        --accent-blue: #3b82f6;
        --f-display: 'Syne', sans-serif;
        --f-body: 'Inter', sans-serif;
        --f-mono: 'JetBrains Mono', monospace;
      }
      
      html {
        scrollbar-width: none; /* Firefox */
      }

      body {
        font-family: var(--f-body);
        background-color: var(--bg-color);
        color: #f8fafc;
        overflow-x: hidden;
        -ms-overflow-style: none;  /* IE and Edge */
      }

      /* Hide scrollbar for Chrome, Safari and Opera */
      ::-webkit-scrollbar {
        display: none;
      }

      .font-display { font-family: var(--f-display); }
      .font-mono { font-family: var(--f-mono); }

      .glass {
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      
      .glass-card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.05);
        transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
      }
      
      .glass-card:hover {
        background: rgba(255, 255, 255, 0.06);
        border-color: rgba(139, 92, 246, 0.4);
        transform: translateY(-8px) scale(1.01);
        box-shadow: 
          0 30px 60px -12px rgba(0, 0, 0, 0.6),
          0 0 30px rgba(139, 92, 246, 0.15);
      }

      .text-glow {
        text-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
      }

      .bg-mesh {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background-image: 
          radial-gradient(at 0% 0%, hsla(253, 16%, 7%, 1) 0, transparent 50%), 
          radial-gradient(at 50% 0%, hsla(225, 39%, 30%, 0.2) 0, transparent 50%), 
          radial-gradient(at 100% 0%, hsla(339, 49%, 30%, 0.15) 0, transparent 50%),
          radial-gradient(at 80% 80%, hsla(262, 83%, 58%, 0.05) 0, transparent 50%);
        background-color: #020617;
      }

      .grid-pattern {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background-image: 
          linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 60px 60px;
        mask-image: radial-gradient(circle at center, black, transparent 80%);
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(2deg); }
      }
      .animate-float {
        animation: float 8s ease-in-out infinite;
      }

      .gradient-text {
        background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .reveal-text {
        overflow: hidden;
        white-space: nowrap;
        border-right: 2px solid var(--accent-purple);
        animation: typing 3.5s steps(40, end), blink-caret .75s step-end infinite;
      }

      @keyframes typing {
        from { width: 0 }
        to { width: 100% }
      }

      @keyframes blink-caret {
        from, to { border-color: transparent }
        50% { border-color: var(--accent-purple); }
      }

      .gradient-border {
        position: relative;
        border-radius: 1rem;
        background: linear-gradient(to right, #8b5cf6, #3b82f6);
        padding: 1px;
      }
      .gradient-border-inner {
        background: #020617;
        border-radius: calc(1rem - 1px);
      }
    </style>
